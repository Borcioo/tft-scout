name: deploy

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The set production serves. Bumping it (with config/tft.php `sets`
    # ready) is all a set change takes: the deploy imports the new set and
    # syncs MetaTFT while the old one stays live, then switches .env.
    env:
      TFT_SET: '18'
      METATFT_QUEUE: '1100'
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress --prefer-dist

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Prepare deploy archive
        run: |
          tar czf /tmp/deploy.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='storage/logs/*.log' \
            --exclude='storage/framework/cache/data/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='tmp' \
            --exclude='legacy' \
            --exclude='rawData' \
            --exclude='tests' \
            --exclude='.github' \
            --exclude='.claude' \
            .

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MIKRUS_SSH_KEY }}" > ~/.ssh/mikrus
          chmod 600 ~/.ssh/mikrus
          ssh-keyscan -p ${{ secrets.MIKRUS_PORT }} ${{ secrets.MIKRUS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload archive
        run: |
          scp -i ~/.ssh/mikrus -P ${{ secrets.MIKRUS_PORT }} \
            /tmp/deploy.tar.gz \
            root@${{ secrets.MIKRUS_HOST }}:/tmp/deploy.tar.gz

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/mikrus -p ${{ secrets.MIKRUS_PORT }} \
            root@${{ secrets.MIKRUS_HOST }} 'bash -s' << 'DEPLOY'
          set -e
          cd /var/www/tft-scout

          TARGET_SET='${{ env.TFT_SET }}'
          TARGET_QUEUE='${{ env.METATFT_QUEUE }}'

          set_env() {
            if grep -qE "^$1=" .env; then
              sed -i "s|^$1=.*|$1=$2|" .env
            else
              printf '\n%s=%s\n' "$1" "$2" >> .env
            fi
          }

          # Pin the set the live site serves before new code lands: a release
          # may default to a newer set that has no rows until imported.
          if ! grep -qE '^TFT_SET=' .env; then
            LIVE_SET="$(php artisan tinker --execute="echo config('services.tft.set');" | tail -n 1)"
            case "$LIVE_SET" in
              ''|*[!0-9]*) echo "Cannot read the live set (got '$LIVE_SET'); aborting before upload." >&2; exit 1 ;;
            esac
            set_env TFT_SET "$LIVE_SET"
          fi

          # Extract new code (preserve .env, storage)
          tar xzf /tmp/deploy.tar.gz --no-same-owner
          rm /tmp/deploy.tar.gz

          # Fix ownership
          chown -R www-data:www-data /var/www/tft-scout
          chmod -R 775 storage bootstrap/cache

          # The previous release's cached config lacks keys the new code
          # reads (e.g. tft.sets) — drop it before running any artisan work.
          php artisan config:clear

          # Laravel production steps
          php artisan migrate --force

          # Set change: import the target set and its MetaTFT stats while
          # the old set keeps serving, then switch. If either fails the site
          # stays on the old set, the release still gets its caches and
          # restarts below, and the job fails at the end.
          SWITCH_FAILED=
          LIVE_SET="$(grep -E '^TFT_SET=' .env | cut -d= -f2)"
          if [ "$LIVE_SET" != "$TARGET_SET" ]; then
            if php artisan tft:import --set="$TARGET_SET" && php artisan metatft:sync --set="$TARGET_SET"; then
              set_env TFT_SET "$TARGET_SET"
              set_env METATFT_QUEUE "$TARGET_QUEUE"
            else
              SWITCH_FAILED=1
              echo "::error::Set $TARGET_SET import/sync failed; production stays on set $LIVE_SET"
            fi
            # Import/sync ran as root: icons, logs and the CDragon cache
            # must stay writable for php-fpm.
            chown -R www-data:www-data public/icons storage
          fi

          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          # Restart services. Force-kill queue workers first — a worker
          # mid-sync can take `stopwaitsecs` (default 1h) to exit gracefully,
          # which makes deploys hang. Killing the process bypasses the
          # graceful wait; supervisor's autorestart brings it back on the
          # new code immediately. queue:work is idempotent per-job so
          # killed work is retried by the next worker.
          pkill -9 -f 'artisan queue:work' || true

          systemctl restart php8.4-fpm
          supervisorctl reread
          supervisorctl update
          supervisorctl restart all

          if [ -n "$SWITCH_FAILED" ]; then
            echo "Deployed on set $LIVE_SET; switch to set $TARGET_SET failed: $(date)"
            exit 1
          fi

          echo "Deploy complete: $(date)"
          DEPLOY
